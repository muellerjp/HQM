org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# Active platform for this workspace. Controls which subprojects are configured
# and which runClient / runServer the root convenience tasks delegate to.
# Options: fabric | forge | neoforge | all
# Override on the command line with -Pplatform=<value>.
platform=neoforge

mod_version=5.13.2
maven_group=me.shedaniel
archives_base_name=HQM

# Libraries
annotations_version=23.0.0
architectury_version=6.2.43
jankson_version=1.2.1
minecraft_version=1.21.1

# Fabric
fabric_api_version=0.60.0+1.19.2
fabric_loader_version=0.14.9
fabric_reborncore_version=1.19:5.4.0
fabric_techreborn_version=1.19:5.4.0
fabric_roughlyenoughitems=9.1.530
fabric_cardinal_components=5.0.1

# Forge
forge_version=43.1.0

# NeoForge (1.21.1)
neoForgeVersion=21.1.197
# Architectury API for NeoForge 1.21.1 — https://maven.architectury.dev/
neoforge_architectury_version=13.0.8

# ── NeoForge run client: optional local sibling project paths ──────────────────
# Set these (or pass via -P flags) to load local builds into the run client/server.
# When absent the build falls back to the Maven versions configured below.
# minecoloniesProjectDir=C:/Users/Mr.101Freaking/Desktop/Projects/minecolonies
# tfcProjectDir=C:/Users/Mr.101Freaking/Desktop/Projects/TerraFirmaCraft
# tfcMinecolCompatProjectDir=C:/Users/Mr.101Freaking/Desktop/Projects/tfc-minecol-compat

# ── Maven fallback versions ────────────────────────────────────────────────────
# Used for runClient/runServer when sibling project builds are not available.
#
# MineColonies: https://ldtteam.jfrog.io/ldtteam/modding/  (group: com.ldtteam, artifact: minecolonies)
minecolonies_maven_version=1.1.1300-1.21.1

# ── MineColonies companion mod versions ───────────────────────────────────────
# When a local minecolonies/gradle.properties is readable these are sourced from
# it automatically.  The values below are fallbacks; keep in sync with MC.
structurize_version=1.0.810-1.21.1-snapshot
blockUI_version=1.0.199-1.21.1-snapshot
domumOrnamentumVersion=1.0.223-snapshot
multiPistonVersion=1.2.51-1.21.1-snapshot

# TerraFirmaCraft: served via Modrinth Maven (https://api.modrinth.com/maven)
# Value must be the Modrinth version-id, not the human-readable version number.
# Find it at https://modrinth.com/mod/terrafirmacraft/versions
tfc_maven_version=lv9gSYg1

# ── TerraFirmaCraft companion mod versions ────────────────────────────────────
# Keep in sync with val patchouliVersion in TerraFirmaCraft/build.gradle.kts.
patchouliVersion=1.21.1-92-NEOFORGE

# Just Enough Items: https://maven.blamejared.com/mezz/jei/
jei_version=19.27.0.340