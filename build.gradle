plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.2-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    apply plugin: "java"

    group = project.maven_group

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        // neoforge targets Java 21; its own build.gradle sets the toolchain.
        // fabric and forge target Java 17.
        if (project.name != 'neoforge') {
            options.release = 17
        }
    }

    java {
        withSourcesJar()
    }
}

def ciVersion = System.getenv('VERSION')
version = (ciVersion?.trim()) ? "${rootProject.minecraft_version}-${ciVersion}" : "${rootProject.minecraft_version}-${rootProject.mod_version}"
base {
    archivesName = rootProject.archives_base_name
}

// neoforge uses net.neoforged.moddev instead of architectury-loom
configure(subprojects.findAll { it.name != 'neoforge' }) {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

configure(subprojects.findAll { it.name != 'neoforge' }) {
    apply plugin: "architectury-plugin"

    base { archivesName = project.archives_base_name }
    version = rootProject.version
}

// Convenience root-level tasks that delegate to the active platform.
// Set platform in gradle.properties or pass -Pplatform=<fabric|forge|neoforge|all>.
// When platform=all, runClient defaults to neoforge.
def activePlatform = findProperty('platform') ?: 'neoforge'
def runTarget = activePlatform == 'all' ? 'neoforge' : activePlatform

tasks.register('runClient') {
    dependsOn ":${runTarget}:runClient"
}

tasks.register('runServer') {
    dependsOn ":${runTarget}:runServer"
}
